[package]
name = "human-brain-runtime"
version = "1.0.5"
edition = "2021"
description = "Synthetic Brain Architecture Prototype Alpha runtime"
authors = ["ArkansasIo"]

[[bin]]
name = "human-brain"
path = "src/main.rs"

[features]
default = ["virtual"]
virtual = ["synthetic-brain-hal/virtual"]
raspberry-pi3 = ["synthetic-brain-hal/raspberry-pi3"]
custom-cartridge = ["synthetic-brain-hal/custom-cartridge"]

[dependencies]
synthetic-brain-hal = { path = "../../hardware/human_brain/software", default-features = false }
